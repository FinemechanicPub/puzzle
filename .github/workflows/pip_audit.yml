name: Vulnerability check

on:
  pull_request:
    branches:
      - main

jobs:
  pip-audit:
    name: Dependency test with pip audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
