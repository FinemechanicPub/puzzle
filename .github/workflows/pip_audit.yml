name: Vulnerability check

on:
  pull_request:
    branches:
      - main

jobs:
  pip-audit:
    name: Dependency test with pip audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: pypa/gh-action-pip-audit@v1.0.0
        with:
          inputs: requirements.txt
